# claude-plugin's release workflow (fab0 stage 12 spec R12.19, section 5.7; agent interface section 10.4): a merge to
# main that changes a plugin's version is tagged, with a GitHub release. It reads the plugin folders from
# .claude-plugin/marketplace.json's sources. The plugin at ./ is tagged v<version>, and a plugin in a folder
# <name>--v<version>, the form `claude plugin tag` makes. A tag that exists is left alone. This file isn't among the
# files fab0's releases copy here: it is claude-plugin's own.
name: release

on:
  push:
    branches: [main]
    paths: ["**/.claude-plugin/plugin.json", ".claude-plugin/marketplace.json"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag and release each new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          sources=$(jq -r '.plugins[].source | strings' .claude-plugin/marketplace.json)
          if [ -z "$sources" ]; then echo "marketplace.json lists no plugin folder"; exit 1; fi
          # The repository is public, so its tags are read without a token.
          existing=$(git ls-remote --tags --refs origin | cut -f2)
          # Every version is checked before any tag is made.
          new=""
          for source in $sources; do
            dir="${source#./}"; dir="${dir%/}"; dir="${dir:-.}"
            name=$(jq -er .name "$dir/.claude-plugin/plugin.json")
            version=$(jq -er .version "$dir/.claude-plugin/plugin.json")
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "$dir: version $version isn't x.y.z"; exit 1; fi
            if [ "$dir" = "." ]; then tag="v$version"; else tag="$name--v$version"; fi
            # A version is released once: a merge that leaves it unchanged, or brings back an older one, makes nothing.
            if grep -qxF "refs/tags/$tag" <<< "$existing"; then
              echo "$tag is already tagged"
            else
              new="$new $tag"
            fi
          done
          for tag in $new; do
            gh release create "$tag" --target "$SOURCE" --title "$tag" --generate-notes
          done
